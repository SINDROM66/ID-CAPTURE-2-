<!DOCTYPE html>
<html>
<head>
    <title>OCR PSM Test</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <h1>Testing OCR PSM 6</h1>
    <div id="status">Running tests...</div>
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="img_new" src="new_id_back.jpg" crossorigin="anonymous" style="display:none;">

    <script>
        async function runTests() {
            const results = [];
            const img = document.getElementById('img_new');
            
            // Wait for image to load
            await new Promise(r => {
                if (img.complete) r();
                else img.onload = r;
            });

            // Crop bottom 30% of the image
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const cropHeight = img.height * 0.3;
            canvas.width = img.width;
            canvas.height = cropHeight;
            ctx.drawImage(img, 0, img.height - cropHeight, img.width, cropHeight, 0, 0, img.width, cropHeight);

            const worker = await Tesseract.createWorker('eng');
            
            // Try different PSMs
            const psms = ['3', '4', '6', '11'];
            
            for (const psm of psms) {
                await worker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789< ',
                    tessedit_pageseg_mode: psm
                });
                
                try {
                    const { data: { text } } = await worker.recognize(canvas);
                    results.push({
                        psm: psm,
                        text: text
                    });
                } catch (e) {
                    results.push({
                        psm: psm,
                        error: e.message
                    });
                }
            }
            
            await worker.terminate();
            
            await fetch('/submit', {
                method: 'POST',
                body: JSON.stringify(results, null, 2)
            });
            
            document.getElementById('status').innerText = 'Tests completed!';
        }

        window.onload = runTests;
    </script>
</body>
</html>
